name: Test skills

on:
  push:
    paths:
      - '.agents/skills/codex-external-provider/**'
      - '.agents/skills/codex-harness-bridge/**'
  pull_request:
    paths:
      - '.agents/skills/codex-external-provider/**'
      - '.agents/skills/codex-harness-bridge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check package and run tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = sorted(Path('.agents/skills').glob('*/SKILL.md'))
          expected = {
              'codex-native-orchestrator',
              'codex-external-provider',
              'codex-harness-bridge',
          }
          assert {path.parent.name for path in roots} == expected, roots
          PY
          for skill in codex-external-provider codex-harness-bridge; do
            python -B -m unittest discover -s ".agents/skills/$skill/tests" -p 'test_*.py' -q
          done
      - name: Run installer tests only on explicit manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s .agents/skills/codex-native-orchestrator/tests -p 'test_*.py' -q
          python -B -m unittest discover -s zcode/tests -p 'test_*.py' -q
